<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#faf7f2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>Omaľovánka</title>
<style>
  :root { --bg:#faf7f2; --ink:#2b2b2b; --accent:#ef476f; --card:#fff; --muted:#8a8478; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overflow:hidden; overscroll-behavior:none; }
  #app { height:100dvh; display:flex; flex-direction:column; padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom); }
  header { display:flex; gap:8px; align-items:center; padding:8px 10px; }
  .seg { display:flex; background:#ece7dd; border-radius:999px; padding:3px; flex:1; }
  .seg button { flex:1; border:0; background:transparent; padding:9px 6px; border-radius:999px; font-size:15px; font-weight:600; color:var(--muted); }
  .seg button.on { background:var(--card); color:var(--ink); box-shadow:0 1px 4px #0002; }
  .ic { border:0; background:var(--card); width:42px; height:42px; border-radius:50%; font-size:19px; box-shadow:0 1px 4px #0002; flex:none; }
  .ic:disabled { opacity:.35; }
  #stageWrap { flex:1; position:relative; overflow:hidden; background:#ece7dd; touch-action:none; }
  #stage { position:absolute; left:0; top:0; transform-origin:0 0; background:#fff; box-shadow:0 2px 14px #0003; }
  #stage canvas { position:absolute; left:0; top:0; width:100%; height:100%; display:block; image-rendering:auto; }
  #empty { position:absolute; inset:0; display:flex; flex-direction:column; gap:14px; align-items:center; justify-content:center; text-align:center; padding:24px; }
  #empty h1 { margin:0; font-size:28px; }
  #empty p { margin:0; color:var(--muted); max-width:300px; line-height:1.4; }
  .big { border:0; background:var(--accent); color:#fff; font-size:17px; font-weight:700; padding:14px 22px; border-radius:16px; min-width:230px; }
  .big.alt { background:var(--card); color:var(--ink); box-shadow:0 1px 4px #0003; }
  #busy { position:absolute; inset:0; background:#faf7f2cc; display:none; align-items:center; justify-content:center; font-weight:700; font-size:18px; z-index:5; }
  #controls { padding:8px 12px 4px; display:flex; align-items:center; gap:10px; font-size:13px; color:var(--muted); }
  #controls input[type=range] { flex:1; accent-color:var(--accent); height:30px; }
  #controls .lbl { min-width:74px; text-align:right; color:var(--ink); font-weight:600; }
  #palette { display:flex; gap:10px; overflow-x:auto; padding:6px 12px 12px; scrollbar-width:none; }
  #palette::-webkit-scrollbar { display:none; }
  .sw { flex:none; width:38px; height:38px; border-radius:50%; border:3px solid #fff; box-shadow:0 0 0 1px #0003; position:relative; }
  .sw.on { box-shadow:0 0 0 3px var(--ink); transform:scale(1.12); }
  .sw.eraser { background:repeating-conic-gradient(#ddd 0 25%, #fff 0 50%) 0 0/12px 12px; }
  .sw.custom { background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red); overflow:hidden; }
  .sw.custom input { position:absolute; inset:-10px; opacity:0; width:60px; height:60px; }
  input[type=file] { display:none; }
  #stage canvas { pointer-events:none; }
  #toast { position:absolute; left:50%; top:14px; transform:translateX(-50%); background:#2b2b2bdd; color:#fff; padding:9px 16px; border-radius:999px;
    font-size:14px; font-weight:600; opacity:0; transition:opacity .2s; pointer-events:none; z-index:6; white-space:nowrap; }
  #toast.show { opacity:1; }
  #info { text-align:center; font-size:13px; color:var(--muted); padding:6px 12px 0; min-height:22px; font-weight:600; }
  .sw.num { display:flex; align-items:center; justify-content:center; font-weight:800; font-size:15px; }
  .sw.num.done { opacity:.35; }
  .sw.num.done::after { content:"✓"; position:absolute; right:-4px; top:-6px; font-size:13px; color:#2a9d8f; background:#fff; border-radius:50%; width:16px; height:16px; line-height:16px; text-align:center; opacity:1; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="seg" id="modes">
      <button data-mode="reality" class="on">📷 Realita</button>
      <button data-mode="fantasy">✨ Fantázia</button>
    </div>
    <button class="ic" id="btnNew" title="Nová fotka">🖼️</button>
    <button class="ic" id="btnUndo" title="Späť" disabled>↩️</button>
    <button class="ic" id="btnSave" title="Uložiť" disabled>💾</button>
  </header>

  <div id="stageWrap">
    <div id="stage" hidden>
      <canvas id="cColor"></canvas>
      <canvas id="cHint"></canvas>
      <canvas id="cLines"></canvas>
      <canvas id="cNums"></canvas>
    </div>
    <div id="empty">
      <h1>🎨 Omaľovánka</h1>
      <p>Odfoť niečo okolo seba alebo vyber fotku. Zmením ju na maľovanie podľa čísel: ťukni na číslo vo farebnej palete a potom na pole s rovnakým číslom.</p>
      <button class="big" id="btnCam">📷 Odfotiť</button>
      <button class="big alt" id="btnGal">🖼️ Vybrať z galérie</button>
      <button class="big alt" id="btnMandala">🌸 Náhodná mandala</button>
    </div>
    <div id="busy">Pripravujem omaľovánku…</div>
    <div id="toast"></div>
  </div>

  <div id="info"></div>
  <div id="controls">
    <span>Málo farieb</span>
    <input type="range" id="complexity" min="1" max="10" value="5">
    <span>Veľa farieb</span>
    <span class="lbl" id="cLabel">5 / 10</span>
  </div>
  <div id="palette"></div>
</div>

<input type="file" id="fileCam" accept="image/*" capture="environment">
<input type="file" id="fileGal" accept="image/*">

<script>
'use strict';
/* ============================== stav ============================== */
const MAXSIDE = 720;
const NS = 3;                      // násobok rozlíšenia vrstvy s číslami (ostrejšie pri priblížení)
const S = {
  mode: 'reality',                 // 'reality' = podľa čísel, 'fantasy' = voľné farby
  source: null, isMandala: false, seed: 1,
  seg: null, segKey: 0, segSrc: null,
  W: 0, H: 0, labels: null, count: 0, bbox: null,
  regionColor: [], regionNum: null, baseRgb: null, numPos: null, palette: [],
  undo: [], selNum: 1, color: [239, 71, 111], eraser: false, filled: 0, total: 0,
};
const $ = id => document.getElementById(id);
const cColor = $('cColor'), cHint = $('cHint'), cLines = $('cLines'), cNums = $('cNums');
let colorData = null;

function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1800); }
function showBusy(on) { $('busy').style.display = on ? 'flex' : 'none'; }

/* ============================== načítanie obrázka ============================== */
async function loadFile(file) {
  if (!file) return;
  let bmp;
  try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch (e) {
    bmp = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(file); });
  }
  const w = bmp.width || bmp.naturalWidth, h = bmp.height || bmp.naturalHeight;
  const k = Math.min(1, MAXSIDE / Math.max(w, h));
  const c = document.createElement('canvas');
  c.width = Math.max(2, Math.round(w * k)); c.height = Math.max(2, Math.round(h * k));
  const g = c.getContext('2d'); g.imageSmoothingQuality = 'high'; g.drawImage(bmp, 0, 0, c.width, c.height);
  setSource(c);
}
function setSource(canvas) { S.source = canvas; S.isMandala = false; S.seg = null; generate(); }

/* ============================== farby: sRGB -> Lab ============================== */
const LIN = new Float32Array(256);
for (let i = 0; i < 256; i++) { const v = i / 255; LIN[i] = v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }
const lf = t => t > 0.008856 ? Math.cbrt(t) : 7.787 * t + 16 / 116;
function rgb2lab(r, g, b, out, o) {
  const R = LIN[r], G = LIN[g], B = LIN[b];
  const x = lf((0.4124 * R + 0.3576 * G + 0.1805 * B) / 0.95047), y = lf(0.2126 * R + 0.7152 * G + 0.0722 * B), z = lf((0.0193 * R + 0.1192 * G + 0.9505 * B) / 1.08883);
  out[o] = 116 * y - 16; out[o + 1] = 500 * (x - y); out[o + 2] = 200 * (y - z);
}

/* Edge-preserving vyhladenie (bilaterálny filter): vyrovná textúru a šum, hrany nechá ostré. */
function bilateral(src, W, H, r, sigR) {
  const out = new Float32Array(src.length), n = 2 * r + 1, ws = new Float32Array(n * n);
  for (let j = -r; j <= r; j++) for (let i = -r; i <= r; i++) ws[(j + r) * n + i + r] = Math.exp(-(i * i + j * j) / (2 * (r * 0.7) * (r * 0.7)));
  const LUT = new Float32Array(1024); for (let i = 0; i < 1024; i++) LUT[i] = Math.exp(-(i * 4) / (2 * sigR * sigR));
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const o = (y * W + x) * 3, L0 = src[o], A0 = src[o + 1], B0 = src[o + 2];
    let sL = 0, sA = 0, sB = 0, sw = 0;
    for (let j = -r; j <= r; j++) { const yy = y + j; if (yy < 0 || yy >= H) continue;
      for (let i = -r; i <= r; i++) { const xx = x + i; if (xx < 0 || xx >= W) continue;
        const p = (yy * W + xx) * 3, dl = src[p] - L0, da = src[p + 1] - A0, db = src[p + 2] - B0;
        let k = ((dl * dl + da * da + db * db) * 0.25) | 0; if (k > 1023) k = 1023;
        const w = ws[(j + r) * n + i + r] * LUT[k];
        sL += src[p] * w; sA += src[p + 1] * w; sB += src[p + 2] * w; sw += w; } }
    out[o] = sL / sw; out[o + 1] = sA / sw; out[o + 2] = sB / sw;
  }
  return out;
}
/* k-means v Lab priestore (k-means++ inicializácia na vzorke pixelov) */
function kmeans(lab, N, K, seed) {
  let s = seed >>> 0; const rnd = () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
  const step = Math.max(1, Math.floor(N / 25000)), idx = []; for (let i = 0; i < N; i += step) idx.push(i);
  const M = idx.length, cen = new Float32Array(K * 3), minD = new Float64Array(M).fill(1e18);
  let first = idx[Math.floor(rnd() * M)]; cen.set(lab.subarray(first * 3, first * 3 + 3), 0);
  for (let k = 1; k < K; k++) {
    let tot = 0;
    for (let m = 0; m < M; m++) { const p = idx[m] * 3, dl = lab[p] - cen[(k - 1) * 3], da = lab[p + 1] - cen[(k - 1) * 3 + 1], db = lab[p + 2] - cen[(k - 1) * 3 + 2]; const d = dl * dl + da * da + db * db; if (d < minD[m]) minD[m] = d; tot += minD[m]; }
    let t = rnd() * tot, pick = M - 1; for (let m = 0; m < M; m++) { t -= minD[m]; if (t <= 0) { pick = m; break; } }
    cen.set(lab.subarray(idx[pick] * 3, idx[pick] * 3 + 3), k * 3);
  }
  const sum = new Float64Array(K * 3), cnt = new Int32Array(K);
  for (let it = 0; it < 12; it++) {
    sum.fill(0); cnt.fill(0);
    for (let m = 0; m < M; m++) { const p = idx[m] * 3; let b = 0, bd = 1e18;
      for (let k = 0; k < K; k++) { const dl = lab[p] - cen[k * 3], da = lab[p + 1] - cen[k * 3 + 1], db = lab[p + 2] - cen[k * 3 + 2], d = dl * dl + da * da + db * db; if (d < bd) { bd = d; b = k; } }
      sum[b * 3] += lab[p]; sum[b * 3 + 1] += lab[p + 1]; sum[b * 3 + 2] += lab[p + 2]; cnt[b]++; }
    for (let k = 0; k < K; k++) if (cnt[k]) { cen[k * 3] = sum[k * 3] / cnt[k]; cen[k * 3 + 1] = sum[k * 3 + 1] / cnt[k]; cen[k * 3 + 2] = sum[k * 3 + 2] / cnt[k]; }
  }
  const cl = new Uint8Array(N);
  for (let i = 0; i < N; i++) { const p = i * 3; let b = 0, bd = 1e18;
    for (let k = 0; k < K; k++) { const dl = lab[p] - cen[k * 3], da = lab[p + 1] - cen[k * 3 + 1], db = lab[p + 2] - cen[k * 3 + 2], d = dl * dl + da * da + db * db; if (d < bd) { bd = d; b = k; } }
    cl[i] = b; }
  return { cl, cen };
}
/* Väčšinový filter 3x3: odstráni osamotené pixely a zubaté okraje. */
function majority(cl, W, H, K) {
  const out = new Uint8Array(cl.length), cnt = new Uint8Array(K);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    cnt.fill(0); let best = cl[y * W + x], bc = 0;
    for (let j = -1; j <= 1; j++) { const yy = y + j; if (yy < 0 || yy >= H) continue;
      for (let i = -1; i <= 1; i++) { const xx = x + i; if (xx < 0 || xx >= W) continue; const c = cl[yy * W + xx]; if (++cnt[c] > bc) { bc = cnt[c]; best = c; } } }
    out[y * W + x] = bc >= 5 ? best : cl[y * W + x];
  }
  return out;
}
/* Súvislé oblasti rovnakej farby (4-susedstvo). Vracia labels 1..n a farbu každej oblasti. */
function components(cm, W, H) {
  const N = W * H, labels = new Int32Array(N), stack = new Int32Array(N), regCl = [0];
  let n = 0;
  for (let st = 0; st < N; st++) {
    if (labels[st]) continue;
    n++; regCl.push(cm[st]); const c = cm[st]; let sp = 0; stack[sp++] = st; labels[st] = n;
    while (sp) { const i = stack[--sp], x = i % W;
      if (x > 0 && !labels[i - 1] && cm[i - 1] === c) { labels[i - 1] = n; stack[sp++] = i - 1; }
      if (x < W - 1 && !labels[i + 1] && cm[i + 1] === c) { labels[i + 1] = n; stack[sp++] = i + 1; }
      if (i >= W && !labels[i - W] && cm[i - W] === c) { labels[i - W] = n; stack[sp++] = i - W; }
      if (i < N - W && !labels[i + W] && cm[i + W] === c) { labels[i + W] = n; stack[sp++] = i + W; } }
  }
  return { labels, n, regCl };
}
/* Vzdialenosť od najbližšej hranice poľa (chamfer 3-4, jednotky = 1/3 pixela). */
function distToBoundary(labels, W, H) {
  const N = W * H, d = new Float32Array(N), INF = 1e9;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x, l = labels[i];
    d[i] = ((x < W - 1 && labels[i + 1] !== l) || (x > 0 && labels[i - 1] !== l) || (y < H - 1 && labels[i + W] !== l) || (y > 0 && labels[i - W] !== l)) ? 0 : INF;
  }
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { const i = y * W + x; let v = d[i];
    if (x > 0) v = Math.min(v, d[i - 1] + 3);
    if (y > 0) { v = Math.min(v, d[i - W] + 3); if (x > 0) v = Math.min(v, d[i - W - 1] + 4); if (x < W - 1) v = Math.min(v, d[i - W + 1] + 4); }
    d[i] = v; }
  for (let y = H - 1; y >= 0; y--) for (let x = W - 1; x >= 0; x--) { const i = y * W + x; let v = d[i];
    if (x < W - 1) v = Math.min(v, d[i + 1] + 3);
    if (y < H - 1) { v = Math.min(v, d[i + W] + 3); if (x < W - 1) v = Math.min(v, d[i + W + 1] + 4); if (x > 0) v = Math.min(v, d[i + W - 1] + 4); }
    d[i] = v; }
  return d;
}
/* Zlúči príliš malé alebo príliš tenké polia so susedom (preferuje podobnú farbu a dlhú spoločnú hranicu). */
function mergeSmall(res, W, H, cen, minArea, minR) {
  const N = W * H;
  for (let round = 0; round < 8; round++) {
    const { labels, n, regCl } = res;
    const area = new Float64Array(n + 1), maxR = new Float32Array(n + 1);
    for (let i = 0; i < N; i++) area[labels[i]]++;
    const d = distToBoundary(labels, W, H);
    for (let i = 0; i < N; i++) { const r = d[i] / 3, l = labels[i]; if (r > maxR[l]) maxR[l] = r; }
    const small = []; for (let l = 1; l <= n; l++) if (area[l] < minArea || maxR[l] < minR) small.push(l);
    if (!small.length || n <= 1) break;
    small.sort((a, b) => area[a] - area[b]);
    const start = new Int32Array(n + 2); for (let l = 1; l <= n; l++) start[l + 1] = start[l] + area[l];
    const fill = start.slice(), pix = new Int32Array(N); for (let i = 0; i < N; i++) pix[fill[labels[i]]++] = i;
    const parent = new Int32Array(n + 1); for (let l = 0; l <= n; l++) parent[l] = l;
    const find = a => { while (parent[a] !== a) { parent[a] = parent[parent[a]]; a = parent[a]; } return a; };
    const tally = new Float64Array(n + 1); let changed = 0;
    for (const s of small) {
      if (parent[s] !== s) continue;
      const touched = [];
      for (let k = start[s]; k < start[s + 1]; k++) { const i = pix[k], x = i % W;
        const nb = [x > 0 ? i - 1 : -1, x < W - 1 ? i + 1 : -1, i >= W ? i - W : -1, i < N - W ? i + W : -1];
        for (const j of nb) { if (j < 0) continue; const t = find(labels[j]); if (t !== s) { if (!tally[t]) touched.push(t); tally[t]++; } } }
      let best = 0, bs = -1; const cs = regCl[s];
      for (const t of touched) {
        const ct = regCl[t], dl = cen[cs * 3] - cen[ct * 3], da = cen[cs * 3 + 1] - cen[ct * 3 + 1], db = cen[cs * 3 + 2] - cen[ct * 3 + 2];
        const sc = tally[t] * Math.exp(-Math.sqrt(dl * dl + da * da + db * db) / 25); if (sc > bs) { bs = sc; best = t; } tally[t] = 0; }
      if (best) { parent[s] = best; area[best] += area[s]; changed++; }
    }
    if (!changed) break;
    const cm = new Uint8Array(N);
    for (let i = 0; i < N; i++) cm[i] = regCl[find(labels[i])];
    res = components(cm, W, H);
  }
  return res;
}

/* ============================== maľovanie podľa čísel ============================== */
function segment(canvas, c) {
  const W = canvas.width, H = canvas.height, N = W * H;
  const rgba = canvas.getContext('2d').getImageData(0, 0, W, H).data;
  let lab = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) rgb2lab(rgba[i * 4], rgba[i * 4 + 1], rgba[i * 4 + 2], lab, i * 3);
  const r = c <= 3 ? 3 : 2;
  lab = bilateral(bilateral(lab, W, H, r, 16), W, H, r, 16);
  const K = Math.round(6 + (c - 1) * 2.2);
  const km = kmeans(lab, N, K, 12345);
  let cl = majority(majority(km.cl, W, H, K), W, H, K);
  const scale = N / 430000;
  const minArea = Math.round(scale * 900 * Math.pow(0.05, (c - 1) / 9)), minR = 6 - 0.15 * (c - 1);
  const res = mergeSmall(components(cl, W, H), W, H, km.cen, minArea, minR);
  const { labels, n, regCl } = res;
  // barvy paliet: priemer skutočných farieb pixelov danej skupiny
  const sums = new Float64Array(K * 4);
  for (let i = 0; i < N; i++) { const k = regCl[labels[i]]; sums[k * 4] += rgba[i * 4]; sums[k * 4 + 1] += rgba[i * 4 + 1]; sums[k * 4 + 2] += rgba[i * 4 + 2]; sums[k * 4 + 3]++; }
  const used = []; for (let k = 0; k < K; k++) if (sums[k * 4 + 3]) used.push(k);
  const lum = k => (0.299 * sums[k * 4] + 0.587 * sums[k * 4 + 1] + 0.114 * sums[k * 4 + 2]) / sums[k * 4 + 3];
  used.sort((a, b) => lum(a) - lum(b));
  const numOf = new Int32Array(K), palette = [];
  used.forEach((k, ix) => { numOf[k] = ix + 1; const m = sums[k * 4 + 3]; palette.push({ n: ix + 1, rgb: [Math.round(sums[k * 4] / m), Math.round(sums[k * 4 + 1] / m), Math.round(sums[k * 4 + 2] / m)], total: 0, done: 0 }); });
  const regionNum = new Int32Array(n + 1); for (let l = 1; l <= n; l++) { regionNum[l] = numOf[regCl[l]]; palette[regionNum[l] - 1].total++; }
  // čiary medzi poľami (2 px)
  const lines = new Uint8Array(N);
  for (let y = 0; y < H - 1; y++) for (let x = 0; x < W - 1; x++) { const i = y * W + x;
    if (labels[i] !== labels[i + 1]) { lines[i] = 1; lines[i + 1] = 1; }
    if (labels[i] !== labels[i + W]) { lines[i] = 1; lines[i + W] = 1; } }
  // pozícia čísla = bod najďalej od hranice poľa
  const d = distToBoundary(labels, W, H), bestD = new Float32Array(n + 1).fill(-1), bestI = new Int32Array(n + 1);
  for (let i = 0; i < N; i++) { const l = labels[i]; if (d[i] > bestD[l]) { bestD[l] = d[i]; bestI[l] = i; } }
  const numPos = [null];
  for (let l = 1; l <= n; l++) {
    const txt = String(regionNum[l]), r = Math.min(bestD[l] / 3, 60);
    const f = Math.max(5, Math.min(22, 3 * r / txt.length, 1.8 * r));
