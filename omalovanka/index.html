<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#faf7f2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>Omaľovánka</title>
<style>
  :root { --bg:#faf7f2; --ink:#2b2b2b; --accent:#ef476f; --card:#fff; --muted:#8a8478; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overflow:hidden; overscroll-behavior:none; }
  #app { height:100dvh; display:flex; flex-direction:column; padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom); }
  header { display:flex; gap:8px; align-items:center; padding:8px 10px; }
  .seg { display:flex; background:#ece7dd; border-radius:999px; padding:3px; flex:1; }
  .seg button { flex:1; border:0; background:transparent; padding:9px 6px; border-radius:999px; font-size:15px; font-weight:600; color:var(--muted); }
  .seg button.on { background:var(--card); color:var(--ink); box-shadow:0 1px 4px #0002; }
  .ic { border:0; background:var(--card); width:42px; height:42px; border-radius:50%; font-size:19px; box-shadow:0 1px 4px #0002; flex:none; }
  .ic:disabled { opacity:.35; }
  #stageWrap { flex:1; position:relative; overflow:hidden; background:#ece7dd; touch-action:none; }
  #stage { position:absolute; left:0; top:0; transform-origin:0 0; background:#fff; box-shadow:0 2px 14px #0003; }
  #stage canvas { position:absolute; left:0; top:0; width:100%; height:100%; display:block; image-rendering:auto; }
  #empty { position:absolute; inset:0; display:flex; flex-direction:column; gap:14px; align-items:center; justify-content:center; text-align:center; padding:24px; }
  #empty h1 { margin:0; font-size:28px; }
  #empty p { margin:0; color:var(--muted); max-width:300px; line-height:1.4; }
  .big { border:0; background:var(--accent); color:#fff; font-size:17px; font-weight:700; padding:14px 22px; border-radius:16px; min-width:230px; }
  .big.alt { background:var(--card); color:var(--ink); box-shadow:0 1px 4px #0003; }
  #busy { position:absolute; inset:0; background:#faf7f2cc; display:none; align-items:center; justify-content:center; font-weight:700; font-size:18px; z-index:5; }
  #controls { padding:8px 12px 4px; display:flex; align-items:center; gap:10px; font-size:13px; color:var(--muted); }
  #controls input[type=range] { flex:1; accent-color:var(--accent); height:30px; }
  #controls .lbl { min-width:74px; text-align:right; color:var(--ink); font-weight:600; }
  #palette { display:flex; gap:10px; overflow-x:auto; padding:6px 12px 12px; scrollbar-width:none; }
  #palette::-webkit-scrollbar { display:none; }
  .sw { flex:none; width:38px; height:38px; border-radius:50%; border:3px solid #fff; box-shadow:0 0 0 1px #0003; position:relative; }
  .sw.on { box-shadow:0 0 0 3px var(--ink); transform:scale(1.12); }
  .sw.eraser { background:repeating-conic-gradient(#ddd 0 25%, #fff 0 50%) 0 0/12px 12px; }
  .sw.custom { background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red); overflow:hidden; }
  .sw.custom input { position:absolute; inset:-10px; opacity:0; width:60px; height:60px; }
  input[type=file] { display:none; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="seg" id="modes">
      <button data-mode="reality" class="on">📷 Realita</button>
      <button data-mode="fantasy">✨ Fantázia</button>
    </div>
    <button class="ic" id="btnNew" title="Nová fotka">🖼️</button>
    <button class="ic" id="btnUndo" title="Späť" disabled>↩️</button>
    <button class="ic" id="btnSave" title="Uložiť" disabled>💾</button>
  </header>

  <div id="stageWrap">
    <div id="stage" hidden>
      <canvas id="cColor"></canvas>
      <canvas id="cLines"></canvas>
    </div>
    <div id="empty">
      <h1>🎨 Omaľovánka</h1>
      <p>Odfoť niečo okolo seba alebo vyber fotku. Zmením ju na omaľovánku a môžeš vyfarbovať ťuknutím.</p>
      <button class="big" id="btnCam">📷 Odfotiť</button>
      <button class="big alt" id="btnGal">🖼️ Vybrať z galérie</button>
      <button class="big alt" id="btnMandala">🌸 Náhodná mandala</button>
    </div>
    <div id="busy">Kreslím čiary…</div>
  </div>

  <div id="controls">
    <span>Jednoduché</span>
    <input type="range" id="complexity" min="1" max="10" value="5">
    <span>Detailné</span>
    <span class="lbl" id="cLabel">5 / 10</span>
  </div>
  <div id="palette"></div>
</div>

<input type="file" id="fileCam" accept="image/*" capture="environment">
<input type="file" id="fileGal" accept="image/*">

<script>
'use strict';
/* ============================== stav ============================== */
const MAXSIDE = 900;               // pracovné rozlíšenie (dlhšia strana)
const S = {
  mode: 'reality',                 // 'reality' | 'fantasy'
  source: null,                    // canvas s fotkou (v pracovnom rozlíšení) alebo null
  isMandala: false,
  seed: 1,
  W: 0, H: 0,
  labels: null, count: 0, bbox: null,
  regionColor: [],                 // label -> [r,g,b] | null
  undo: [],
  color: [239, 71, 111],
  eraser: false,
};
const $ = id => document.getElementById(id);
const cColor = $('cColor'), cLines = $('cLines');
let colorData = null;              // ImageData na vrstve farieb

/* ============================== načítanie obrázka ============================== */
async function loadFile(file) {
  if (!file) return;
  let bmp;
  try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch (e) {
    bmp = await new Promise((res, rej) => {
      const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(file);
    });
  }
  const w = bmp.width || bmp.naturalWidth, h = bmp.height || bmp.naturalHeight;
  const k = Math.min(1, MAXSIDE / Math.max(w, h));
  const c = document.createElement('canvas');
  c.width = Math.max(2, Math.round(w * k)); c.height = Math.max(2, Math.round(h * k));
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  setSource(c);
}
function setSource(canvas) {
  S.source = canvas; S.isMandala = false;
  generate();
}

/* ============================== spracovanie obrazu ============================== */
function gaussBlur(src, W, H, sigma) {
  const r = Math.max(1, Math.ceil(sigma * 3)), k = new Float32Array(2 * r + 1);
  let sum = 0;
  for (let i = -r; i <= r; i++) { k[i + r] = Math.exp(-(i * i) / (2 * sigma * sigma)); sum += k[i + r]; }
  for (let i = 0; i < k.length; i++) k[i] /= sum;
  const tmp = new Float32Array(W * H), out = new Float32Array(W * H);
  for (let y = 0; y < H; y++) {
    const row = y * W;
    for (let x = 0; x < W; x++) {
      let a = 0;
      for (let i = -r; i <= r; i++) { let xx = x + i; xx = xx < 0 ? 0 : xx >= W ? W - 1 : xx; a += src[row + xx] * k[i + r]; }
      tmp[row + x] = a;
    }
  }
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      let a = 0;
      for (let i = -r; i <= r; i++) { let yy = y + i; yy = yy < 0 ? 0 : yy >= H ? H - 1 : yy; a += tmp[yy * W + x] * k[i + r]; }
      out[y * W + x] = a;
    }
  }
  return out;
}
function channelsOf(canvas) {
  const W = canvas.width, H = canvas.height;
  const d = canvas.getContext('2d').getImageData(0, 0, W, H).data;
  const ch = [new Float32Array(W * H), new Float32Array(W * H), new Float32Array(W * H)];
  for (let i = 0, j = 0; i < W * H; i++, j += 4) { ch[0][i] = d[j]; ch[1][i] = d[j + 1]; ch[2][i] = d[j + 2]; }
  return ch;
}
/* Čiary z fotky: Difference of Gaussians. Zložitosť 1..10 mení hrúbku a citlivosť. */
function dogLines(channels, W, H, c, mask, strictness = 1) {
  const t = (c - 1) / 9;                          // 0..1
  const sigma = 1.8 - 1.1 * t;                    // 1.8 .. 0.7
  const thr = (5 - 3 * t) * strictness;           // 5 .. 2
  for (const ch of channels) {                    // hrana v ktoromkoľvek farebnom kanáli (aj žltá vs. svetlomodrá)
    const a = gaussBlur(ch, W, H, sigma), b = gaussBlur(ch, W, H, sigma * 1.6);
    for (let i = 0; i < a.length; i++) if (Math.abs(a[i] - b[i]) > thr) mask[i] = 1;   // obe strany hrany -> uzavreté obrysy
  }
}
/* Fantázia: vitráž (jitterovaná Voronoi mriežka) + hrubé obrysy fotky */
function voronoiLines(W, H, c, seed, mask) {
  const cell = Math.round(130 - (c - 1) * 11);    // 130 .. 31 px
  const gw = Math.ceil(W / cell) + 2, gh = Math.ceil(H / cell) + 2;
  let s = seed >>> 0; const rnd = () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
  const sx = new Float32Array(gw * gh), sy = new Float32Array(gw * gh);
  for (let gy = 0; gy < gh; gy++) for (let gx = 0; gx < gw; gx++) {
    sx[gy * gw + gx] = (gx - 1 + 0.15 + rnd() * 0.7) * cell;
    sy[gy * gw + gx] = (gy - 1 + 0.15 + rnd() * 0.7) * cell;
  }
  const id = new Int32Array(W * H);
  for (let y = 0; y < H; y++) {
    const cy = Math.floor(y / cell) + 1;
    for (let x = 0; x < W; x++) {
      const cx = Math.floor(x / cell) + 1;
      let best = 1e12, bi = 0;
      for (let dy = -2; dy <= 2; dy++) {
        const yy = cy + dy; if (yy < 0 || yy >= gh) continue;
        for (let dx = -2; dx <= 2; dx++) {
          const xx = cx + dx; if (xx < 0 || xx >= gw) continue;
          const j = yy * gw + xx, ex = sx[j] - x, ey = sy[j] - y, d = ex * ex + ey * ey;
          if (d < best) { best = d; bi = j; }
        }
      }
      id[y * W + x] = bi;
    }
  }
  for (let y = 0; y < H - 1; y++) for (let x = 0; x < W - 1; x++) {
    const i = y * W + x;
    if (id[i] !== id[i + 1] || id[i] !== id[i + W]) { mask[i] = 1; mask[i + 1] = 1; mask[i + W] = 1; }
  }
}
/* Mandala: kreslí sa priamo na canvas, potom sa prahuje */
function mandalaCanvas(W, H, c, seed) {
  let s = seed >>> 0; const rnd = () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const g = cv.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, W, H);
  g.strokeStyle = '#000'; g.lineWidth = 3; g.lineJoin = 'round'; g.lineCap = 'round';
  const cx = W / 2, cy = H / 2, R = Math.min(W, H) * 0.47;
  const rings = 2 + Math.round(c * 0.6);
  const N = [8, 10, 12, 16][Math.floor(rnd() * 4)] * (c > 7 ? 1 : 1);
  g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.stroke();
  g.beginPath(); g.arc(cx, cy, R * 0.07, 0, Math.PI * 2); g.stroke();
  for (let k = 0; k < rings; k++) {
    const r0 = R * (0.07 + 0.93 * k / rings), r1 = R * (0.07 + 0.93 * (k + 1) / rings);
    const n = N * (rnd() < 0.3 && k > 0 ? 2 : 1);
    const kind = Math.floor(rnd() * 3);
    g.beginPath(); g.arc(cx, cy, r1, 0, Math.PI * 2); g.stroke();
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2, da = Math.PI / n;
      g.save(); g.translate(cx, cy); g.rotate(a);
      g.beginPath();
      if (kind === 0) {            // okvetný lístok
        g.moveTo(r0, 0);
        g.quadraticCurveTo((r0 + r1) / 2, -(r1 - r0) * 0.9, r1, 0);
        g.quadraticCurveTo((r0 + r1) / 2, (r1 - r0) * 0.9, r0, 0);
      } else if (kind === 1) {     // kvapka s bodkou
        g.moveTo(r0, 0); g.lineTo(r1, 0);
        g.moveTo((r0 + r1) / 2 + (r1 - r0) * 0.28, 0);
        g.arc((r0 + r1) / 2, 0, (r1 - r0) * 0.28, 0, Math.PI * 2);
        g.moveTo(r0, 0); g.lineTo(r1, Math.tan(da) * r1 * 0.0);
      } else {                     // zubatý výstupok
        g.moveTo(r0 * Math.cos(-da), r0 * Math.sin(-da));
        g.lineTo(r1, 0);
        g.lineTo(r0 * Math.cos(da), r0 * Math.sin(da));
      }
      g.stroke();
      if (kind !== 1) {            // lúč od stredu k okraju
        g.beginPath(); g.moveTo(r0, 0); g.lineTo((r0 + r1) / 2, 0); g.stroke();
      }
      g.restore();
    }
    // radiálne deliace čiary, aby boli polia uzavreté
    for (let i = 0; i < n; i++) {
      const a = ((i + 0.5) / n) * Math.PI * 2;
      g.beginPath(); g.moveTo(cx + r0 * Math.cos(a), cy + r0 * Math.sin(a)); g.lineTo(cx + r1 * Math.cos(a), cy + r1 * Math.sin(a)); g.stroke();
    }
  }
  return cv;
}

/* ============================== oblasti ============================== */
function dilate(mask, W, H) {
  const out = new Uint8Array(mask);
  for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
    const i = y * W + x;
    if (!mask[i] && (mask[i - 1] || mask[i + 1] || mask[i - W] || mask[i + W])) out[i] = 1;
  }
  return out;
}
/* Označí súvislé biele oblasti; príliš malé premení na čiaru. */
function labelRegions(mask, W, H, minArea) {
  const labels = new Int32Array(W * H);
  const stack = new Int32Array(W * H);
  let n = 0; const bbox = [0, 0, 0, 0];
  for (let start = 0; start < labels.length; start++) {
    if (mask[start] || labels[start]) continue;
    n++;
    let sp = 0, area = 0, x0 = W, y0 = H, x1 = 0, y1 = 0;
    stack[sp++] = start; labels[start] = n;
    while (sp) {
      const i = stack[--sp]; area++;
      const x = i % W, y = (i - x) / W;
      if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
      if (x > 0 && !mask[i - 1] && !labels[i - 1]) { labels[i - 1] = n; stack[sp++] = i - 1; }
      if (x < W - 1 && !mask[i + 1] && !labels[i + 1]) { labels[i + 1] = n; stack[sp++] = i + 1; }
      if (y > 0 && !mask[i - W] && !labels[i - W]) { labels[i - W] = n; stack[sp++] = i - W; }
      if (y < H - 1 && !mask[i + W] && !labels[i + W]) { labels[i + W] = n; stack[sp++] = i + W; }
    }
    bbox.push(x0, y0, x1, y1);
    if (area < minArea) {                  // drobný šum -> čiara
      for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) { const i = y * W + x; if (labels[i] === n) { labels[i] = 0; mask[i] = 1; } }
      bbox[n * 4] = bbox[n * 4 + 1] = bbox[n * 4 + 2] = bbox[n * 4 + 3] = -1;
    }
  }
  return { labels, count: n, bbox: Int32Array.from(bbox) };
}

/* ============================== generovanie ============================== */
function showBusy(on) { $('busy').style.display = on ? 'flex' : 'none'; }
let genToken = 0;
function generate() {
  const token = ++genToken;
  showBusy(true);
  setTimeout(() => {
    if (token !== genToken) return;
    const c = +$('complexity').value;
    let W, H;
    const mask0 = () => new Uint8Array(W * H);
    let mask;
    if (S.isMandala || (S.mode === 'fantasy' && !S.source)) {
      S.isMandala = true;
      W = 800; H = 800;
      const g = mandalaCanvas(W, H, c, S.seed);
      const d = g.getContext('2d').getImageData(0, 0, W, H).data;
      mask = mask0(); for (let i = 0; i < mask.length; i++) mask[i] = d[i * 4] < 140 ? 1 : 0;
    } else {
      W = S.source.width; H = S.source.height;
      mask = mask0();
      const gray = channelsOf(S.source);
      if (S.mode === 'reality') dogLines(gray, W, H, c, mask);
      else { voronoiLines(W, H, c, S.seed, mask); dogLines(gray, W, H, Math.min(c, 4), mask, 1.6); }
    }
    mask = dilate(mask, W, H);                       // zatvorí malé medzery v čiarach
    const minArea = Math.round(14 + (10 - c) * 9);
    const r = labelRegions(mask, W, H, minArea);
    S.W = W; S.H = H; S.labels = r.labels; S.count = r.count; S.bbox = r.bbox;
    S.regionColor = new Array(r.count + 1).fill(null); S.undo = [];
    // vrstvy
    cColor.width = cLines.width = W; cColor.height = cLines.height = H;
    colorData = cColor.getContext('2d').createImageData(W, H);
    const lg = cLines.getContext('2d'), li = lg.createImageData(W, H);
    for (let i = 0; i < mask.length; i++) if (mask[i]) { li.data[i * 4 + 3] = 255; li.data[i * 4] = li.data[i * 4 + 1] = li.data[i * 4 + 2] = 34; }
    lg.putImageData(li, 0, 0);
    $('empty').style.display = 'none'; $('stage').hidden = false;
    $('btnSave').disabled = false; updateUndo();
    fitView(); showBusy(false);
  }, 30);
}

/* ============================== vyfarbovanie ============================== */
function paintRegion(label, rgb) {
  const W = S.W, b = S.bbox, d = colorData.data;
  const x0 = b[label * 4], y0 = b[label * 4 + 1], x1 = b[label * 4 + 2], y1 = b[label * 4 + 3];
  if (x0 < 0) return;
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const i = y * W + x;
    if (S.labels[i] !== label) continue;
    const j = i * 4;
    if (rgb) { d[j] = rgb[0]; d[j + 1] = rgb[1]; d[j + 2] = rgb[2]; d[j + 3] = 255; } else d[j + 3] = 0;
  }
  // do čiar pod hranicou tiež presiahne farba cez dilatované okraje (čiary ju prekryjú)
  cColor.getContext('2d').putImageData(colorData, 0, 0, x0, y0, x1 - x0 + 1, y1 - y0 + 1);
}
function labelAt(x, y) {
  x = Math.round(x); y = Math.round(y);
  if (x < 0 || y < 0 || x >= S.W || y >= S.H) return 0;
  const l = S.labels[y * S.W + x]; if (l) return l;
  for (let r = 1; r <= 6; r++)                       // ťuknutie na čiaru -> najbližšie pole
    for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
      const xx = x + dx, yy = y + dy;
      if (xx < 0 || yy < 0 || xx >= S.W || yy >= S.H) continue;
      const q = S.labels[yy * S.W + xx]; if (q) return q;
    }
  return 0;
}
function tapFill(cx, cy) {
  const r = $('stage').getBoundingClientRect();
  const l = labelAt((cx - r.left) / r.width * S.W, (cy - r.top) / r.height * S.H);
  if (!l) return;
  const rgb = S.eraser ? null : S.color, prev = S.regionColor[l];
  if ((prev && rgb && prev[0] === rgb[0] && prev[1] === rgb[1] && prev[2] === rgb[2]) || (!prev && !rgb)) return;
  S.undo.push({ l, prev }); if (S.undo.length > 200) S.undo.shift();
  S.regionColor[l] = rgb; paintRegion(l, rgb); updateUndo();
}
function undo() {
  const u = S.undo.pop(); if (!u) return;
  S.regionColor[u.l] = u.prev; paintRegion(u.l, u.prev); updateUndo();
}
function updateUndo() { $('btnUndo').disabled = !S.undo.length; }

/* ============================== zoom & posun ============================== */
const V = { s: 1, x: 0, y: 0, min: 1 };
const wrap = $('stageWrap'), stage = $('stage');
function applyView() {
  // nenechaj obrázok úplne uletieť z obrazovky
  const ww = wrap.clientWidth, wh = wrap.clientHeight, sw = S.W * V.s, sh = S.H * V.s;
  V.x = sw <= ww ? (ww - sw) / 2 : Math.min(0, Math.max(ww - sw, V.x));
  V.y = sh <= wh ? (wh - sh) / 2 : Math.min(0, Math.max(wh - sh, V.y));
  stage.style.transform = `translate(${V.x}px,${V.y}px) scale(${V.s})`;
}
function fitView() {
  const ww = wrap.clientWidth, wh = wrap.clientHeight;
  stage.style.width = S.W + 'px'; stage.style.height = S.H + 'px';
  V.min = V.s = Math.min((ww - 16) / S.W, (wh - 16) / S.H); V.x = V.y = 0; applyView();
}
function zoomAt(f, px, py) {
  const ns = Math.min(V.min * 10, Math.max(V.min, V.s * f)), k = ns / V.s;
  V.x = px - (px - V.x) * k; V.y = py - (py - V.y) * k; V.s = ns; applyView();
}
const ptrs = new Map(); let gesture = null;
wrap.addEventListener('pointerdown', e => {
  if (stage.hidden) return;
  wrap.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  gesture = { moved: false, sx: e.clientX, sy: e.clientY, multi: ptrs.size > 1, last: null };
});
wrap.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId); if (!p || !gesture) return;
  const rect = wrap.getBoundingClientRect();
  if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()];
    const od = Math.hypot(a.x - b.x, a.y - b.y), omx = (a.x + b.x) / 2, omy = (a.y + b.y) / 2;
    p.x = e.clientX; p.y = e.clientY;
    const [a2, b2] = [...ptrs.values()];
    const nd = Math.hypot(a2.x - b2.x, a2.y - b2.y), nmx = (a2.x + b2.x) / 2, nmy = (a2.y + b2.y) / 2;
    V.x += nmx - omx; V.y += nmy - omy;
    if (od > 0) zoomAt(nd / od, nmx - rect.left, nmy - rect.top); else applyView();
    gesture.moved = gesture.multi = true; return;
  }
  const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
  if (!gesture.moved && Math.hypot(e.clientX - gesture.sx, e.clientY - gesture.sy) > 8) gesture.moved = true;
  if (gesture.moved && V.s > V.min * 1.01) { V.x += dx; V.y += dy; applyView(); }
});
function endPtr(e) {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if (gesture && !gesture.moved && !gesture.multi && e.type === 'pointerup') tapFill(e.clientX, e.clientY);
  if (!ptrs.size) gesture = null;
}
wrap.addEventListener('pointerup', endPtr); wrap.addEventListener('pointercancel', endPtr);
wrap.addEventListener('wheel', e => { if (stage.hidden) return; e.preventDefault();
  const r = wrap.getBoundingClientRect(); zoomAt(e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX - r.left, e.clientY - r.top); }, { passive: false });
wrap.addEventListener('dblclick', () => { if (!stage.hidden) fitView(); });
addEventListener('resize', () => { if (!stage.hidden) fitView(); });

/* ============================== UI ============================== */
const COLORS = ['#e63946','#ef476f','#f78c6b','#ffa94d','#ffd166','#c7e86a','#8ac926','#2a9d8f','#06d6a0','#4cc9f0','#118ab2','#4361ee','#7b2cbf','#c77dff','#f4a6c0','#8d5a3b','#d9b48f','#ffffff','#9aa0a6','#2b2b2b'];
const hex2rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
function buildPalette() {
  const p = $('palette');
  const add = (cls, onclick, bg) => { const b = document.createElement('button'); b.className = 'sw ' + cls; if (bg) b.style.background = bg; b.onclick = () => { onclick(b); }; p.appendChild(b); return b; };
  const select = b => { p.querySelectorAll('.sw').forEach(x => x.classList.remove('on')); b.classList.add('on'); };
  add('eraser', b => { S.eraser = true; select(b); });
  COLORS.forEach((h, i) => { const b = add('', b => { S.eraser = false; S.color = hex2rgb(h); select(b); }, h); if (i === 1) b.classList.add('on'); });
  const cu = add('custom', () => {}); const inp = document.createElement('input'); inp.type = 'color'; inp.value = '#ff8800';
  inp.oninput = () => { S.eraser = false; S.color = hex2rgb(inp.value); select(cu); cu.style.background = inp.value; };
  cu.appendChild(inp);
}
buildPalette();

$('modes').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.dataset.mode === S.mode) return;
  S.mode = b.dataset.mode;
  [...$('modes').children].forEach(x => x.classList.toggle('on', x === b));
  if (S.mode === 'reality') S.isMandala = false;
  if (S.source || S.mode === 'fantasy' || S.isMandala) { if (S.mode === 'fantasy' && !S.source) S.isMandala = true; generate(); }
});
$('complexity').addEventListener('input', e => $('cLabel').textContent = e.target.value + ' / 10');
$('complexity').addEventListener('change', () => { if (!$('stage').hidden) generate(); });
const pick = cam => () => (cam ? $('fileCam') : $('fileGal')).click();
$('btnCam').onclick = pick(true); $('btnGal').onclick = pick(false);
$('btnNew').onclick = () => $('fileGal').click();
$('btnMandala').onclick = () => { S.seed = (Math.random() * 1e9) | 0; S.isMandala = true; generate(); };
['fileCam', 'fileGal'].forEach(id => $(id).addEventListener('change', e => { loadFile(e.target.files[0]); e.target.value = ''; }));
$('btnUndo').onclick = undo;
$('btnSave').onclick = async () => {
  const out = document.createElement('canvas'); out.width = S.W; out.height = S.H;
  const g = out.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, S.W, S.H);
  g.drawImage(cColor, 0, 0); g.drawImage(cLines, 0, 0);
  const blob = await new Promise(r => out.toBlob(r, 'image/png'));
  const file = new File([blob], 'omalovanka.png', { type: 'image/png' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file] }); return; } catch (e) { if (e.name === 'AbortError') return; } }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'omalovanka.png'; a.click();
};
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
window.__app = { S, setSource, generate };
