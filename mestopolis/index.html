<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#00007a">
<meta name="description" content="Retro 3D budovateľská simulácia mesta">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mestopolis">
<title>Mestopolis 3D – budovateľská simulácia mesta</title>
<link rel="stylesheet" href="style.css">
<meta name="app-version" content="dev">
<script>
// --- kontrola spustenia: zobrazí chybu aj vtedy, keď hra spadne ešte pred načítaním ---
(function () {
  var shown = false;
  function box(title, msg) {
    if (shown && title !== 'Chyba') return;
    shown = true;
    var d = document.getElementById('boot-err');
    if (!d) {
      d = document.createElement('div'); d.id = 'boot-err';
      d.style.cssText = 'position:fixed;z-index:9999;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,94vw);max-height:90vh;overflow:auto;background:#c3c3c3;border:2px solid;border-color:#fff #5a5a5a #5a5a5a #fff;font:bold 13px Tahoma,sans-serif;color:#000';
      (document.body || document.documentElement).appendChild(d);
    }
    var ver = (document.querySelector('meta[name=app-version]') || {}).content;
    var gl = 'nie'; try { gl = document.createElement('canvas').getContext('webgl2') ? 'áno' : 'nie'; } catch (e) {}
    d.innerHTML = '<div style="background:linear-gradient(90deg,#00007a,#1084d0);color:#fff;padding:3px 6px">' + title + '</div>' +
      '<div style="padding:10px;font-weight:normal;white-space:pre-wrap;word-break:break-word" id="boot-msg"></div>' +
      '<div style="padding:0 10px 10px;display:flex;gap:6px;justify-content:flex-end"><button id="boot-reset">Vymazať cache a načítať znova</button><button id="boot-x">Zavrieť</button></div>';
    document.getElementById('boot-msg').textContent = msg + '\n\nVerzia: ' + ver + '\nWebGL 2: ' + gl + '\nPrehliadač: ' + navigator.userAgent;
    document.getElementById('boot-x').onclick = function () { d.remove(); };
    document.getElementById('boot-reset').onclick = function () { location.href = location.pathname + '?reset'; };
  }
  window.__bootError = function (m) { box('Chyba', m); };
  window.addEventListener('error', function (e) {
    var t = e.target;
    if (t && t !== window && (t.src || t.href)) box('Chyba', 'Nepodarilo sa načítať súbor: ' + (t.src || t.href));
    else box('Chyba', (e.message || 'neznáma chyba') + (e.filename ? '\n' + e.filename.split('/').pop() + ':' + e.lineno : ''));
  }, true);
  window.addEventListener('unhandledrejection', function (e) { box('Chyba', 'Chyba: ' + ((e.reason && (e.reason.stack || e.reason.message)) || e.reason)); });
  // chyby, ktoré three.js len zapíše do konzoly (napr. nepodporovaný shader)
  var ce = console.error;
  console.error = function () { try { var m = Array.prototype.join.call(arguments, ' '); if (/THREE|WebGL|shader/i.test(m)) box('Chyba grafiky', m.slice(0, 1500)); } catch (e) {} return ce.apply(console, arguments); };
  setTimeout(function () { if (!window.game) box('Hra sa nenačítala', 'Hra sa nespustila do 15 sekúnd a nenahlásila žiadnu chybu.'); }, 15000);
  // ?reset – odregistrovať service worker, vymazať cache a načítať znova
  if (/[?&]reset/.test(location.search)) {
    var done = function () { location.replace(location.pathname); };
    Promise.all([
      navigator.serviceWorker ? navigator.serviceWorker.getRegistrations().then(function (r) { return Promise.all(r.map(function (x) { return x.unregister(); })); }) : 0,
      window.caches ? caches.keys().then(function (k) { return Promise.all(k.map(function (x) { return caches.delete(x); })); }) : 0,
    ]).then(done, done);
  }
})();
</script>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="menu">
      <button data-menu="city">Mesto</button>
      <button id="saveBtn" title="Uložiť hru (Ctrl+S)">💾 Uložiť</button>
      <button data-menu="budget">Rozpočet</button>
      <button data-menu="maps">Mapy</button>
      <button data-menu="graphs">Grafy</button>
      <button data-menu="disasters">Katastrofy</button>
      <button data-menu="options">Možnosti</button>
      <button data-menu="help">?</button>
      <button id="installBtn" class="hidden" title="Nainštalovať ako aplikáciu">⬇ Inštalovať</button>
    </div>
    <div class="info">
      <span id="cityName" class="inset">—</span>
      <span id="date" class="inset">—</span>
      <span id="funds" class="inset">—</span>
      <span id="pop" class="inset">—</span>
    </div>
    <div id="rci" class="inset" title="Dopyt: Bývanie / Obchod / Priemysel">
      <div class="bar"><div class="fill r"></div><label>R</label></div>
      <div class="bar"><div class="fill c"></div><label>C</label></div>
      <div class="bar"><div class="fill i"></div><label>I</label></div>
    </div>
    <div id="speed">
      <button data-speed="0" title="Pauza (medzerník)">❚❚</button>
      <button data-speed="1" title="Pomaly (1)">▶</button>
      <button data-speed="2" title="Normálne (2)">▶▶</button>
      <button data-speed="3" title="Rýchlo (3)">▶▶▶</button>
    </div>
  </div>
  <div id="main">
    <div id="toolbar"></div>
    <div id="viewport">
      <canvas id="view"></canvas>
      <div id="rotate">
        <button id="undoBtn" title="Späť (Ctrl+Z)" disabled>↶ Späť</button>
        <button id="rotL" title="Otočiť (Q)">⟲</button>
        <button id="rotR" title="Otočiť (E)">⟳</button>
        <button id="zoomIn" title="Priblížiť">+</button>
        <button id="zoomOut" title="Oddialiť">−</button>
      </div>
      <div id="minimapWrap" class="win">
        <div class="title">Mapa</div>
        <canvas id="minimap" width="160" height="160"></canvas>
      </div>
      <div id="overlayLegend" class="win hidden"></div>
    </div>
  </div>
  <div id="statusbar">
    <span id="status" class="inset">Vitajte v Mestopolise!</span>
    <div id="ticker" class="inset"><div id="tickerText"></div></div>
  </div>
  <div id="flyout" class="win hidden"></div>
  <div id="dialogs"></div>
  <div id="toasts"></div>
</div>
<script type="module" src="js/main.js" onerror="window.__bootError && __bootError('Nepodarilo sa načítať hlavný súbor hry (js/main.js).')"></script>
</body>
</html>
