<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tornádo Idle · METEO 24</title>
<style>
:root{
  --navy:#07193d; --blue:#0d3a8c; --blue2:#1556c4; --sky:#6ec1ff; --yellow:#ffd21f; --red:#e5262b; --white:#f4f8ff;
  --panel:rgba(7,25,61,.82); --line:rgba(130,190,255,.35);
  --font: "Segoe UI","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0a1a33;font-family:var(--font);color:var(--white);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 58%,rgba(4,12,32,.4) 100%)}
/* filmový vzhľad (dá sa vypnúť tlačidlom 🎬) */
#grade,#grain{position:fixed;inset:0;pointer-events:none;display:none}
body.cine #grade{display:block;mix-blend-mode:soft-light;background:linear-gradient(180deg,rgba(255,176,96,.20) 0%,rgba(255,200,150,.06) 45%,rgba(24,70,120,.24) 100%)}
body.cine #grain{display:block;inset:-64px;opacity:.11;mix-blend-mode:overlay;background-size:160px 160px;animation:grain .5s steps(1) infinite}
@keyframes grain{0%{transform:translate(0,0)}17%{transform:translate(-31px,19px)}33%{transform:translate(23px,-41px)}50%{transform:translate(-47px,-13px)}67%{transform:translate(37px,29px)}83%{transform:translate(-11px,-53px)}}
body.cine #c{filter:contrast(1.09) saturate(1.14) brightness(.98)}
body.cine #vig{background:radial-gradient(ellipse at 50% 45%,transparent 48%,rgba(3,8,22,.58) 100%)}
#flash{position:fixed;inset:0;background:#dbe8ff;opacity:0;pointer-events:none;mix-blend-mode:screen}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.pop{position:absolute;left:0;top:0;font-weight:800;color:var(--yellow);text-shadow:0 2px 0 rgba(0,0,0,.55),0 0 8px rgba(0,0,0,.5);
  white-space:nowrap;will-change:transform,opacity;font-size:16px}

/* top bar */
#top{position:fixed;left:0;right:0;top:0;height:46px;display:flex;align-items:stretch;z-index:5;
  background:linear-gradient(180deg,var(--blue2),var(--blue));border-bottom:3px solid var(--yellow);box-shadow:0 4px 18px rgba(0,0,0,.35)}
.brand{display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--navy);font-weight:900;letter-spacing:.06em;font-size:20px;clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%);padding-right:30px}
.brand b{color:#fff}.brand em{font-style:normal;color:var(--yellow)}
.live{display:inline-flex;align-items:center;gap:6px;background:var(--red);color:#fff;font-size:12px;padding:3px 8px;border-radius:3px;letter-spacing:.12em}
.live i{width:8px;height:8px;border-radius:50%;background:#fff;animation:blink 1.1s infinite}
@keyframes blink{50%{opacity:.15}}
.headline{flex:1;display:flex;align-items:center;padding:0 16px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock{white-space:nowrap;display:flex;align-items:center;gap:8px;padding:0 16px;background:var(--navy);font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;clip-path:polygon(14px 0,100% 0,100% 100%,0 100%);padding-left:28px}
#bar-btns{display:flex;align-items:center;gap:4px;padding:0 8px;background:var(--navy)}
.ib{background:transparent;border:1px solid var(--line);color:#fff;border-radius:6px;width:30px;height:28px;cursor:pointer;font-size:14px}
.ib.lang{width:34px;font-size:11px;font-weight:900;letter-spacing:.04em}
.langsel{display:inline-flex;gap:4px;vertical-align:middle;margin-left:8px}
.mbox .langsel button{margin:0;padding:3px 9px;font-size:11px;letter-spacing:.06em;background:rgba(255,255,255,.12);color:#cfe2ff;border:1px solid var(--line);border-radius:4px}
.mbox .langsel button.on{background:var(--yellow);color:#06122b;border-color:var(--yellow)}
.ib:hover{background:rgba(255,255,255,.12)}

/* stats */
#left{position:fixed;left:14px;top:62px;width:290px;display:flex;flex-direction:column;gap:10px;z-index:4;pointer-events:none}
.card{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--yellow);border-radius:4px;backdrop-filter:blur(6px);padding:10px 14px;pointer-events:auto}
.lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--sky);font-weight:700}
#money{font-size:38px;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums;text-shadow:0 2px 0 rgba(0,0,0,.4)}
#money small{font-size:22px;color:var(--yellow)}
.sub{display:flex;justify-content:space-between;font-size:13px;color:#cfe2ff;margin-top:2px}
#rate{color:#7dffa6;font-weight:700}
.wind{display:flex;align-items:center;justify-content:space-between;margin-top:2px}
.wind b{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums}
.wind span{color:#cfe2ff;font-size:14px}
.ef{min-width:64px;text-align:center;padding:6px 10px;border-radius:4px;font-weight:900;font-size:20px;letter-spacing:.05em;color:#06122b;background:#8be28b;transition:background .4s}
.mini{display:flex;gap:14px;font-size:12px;color:#b8d2ff;margin-top:4px}.mini b{color:#fff}
#radarwrap{align-self:flex-start;padding:8px;border-radius:50%;background:var(--panel);border:1px solid var(--line);pointer-events:auto;position:relative}
#radar{display:block;width:170px;height:170px;border-radius:50%;cursor:pointer}
#radarwrap .rl{position:absolute;left:50%;top:-9px;transform:translateX(-50%);background:var(--blue);padding:1px 8px;font-size:10px;letter-spacing:.16em;border-radius:3px;border:1px solid var(--line)}

/* upgrades */
#panel{position:fixed;right:14px;top:62px;bottom:62px;width:350px;z-index:4;display:flex;flex-direction:column;background:var(--panel);
  border:1px solid var(--line);border-top:5px solid var(--yellow);border-radius:4px;backdrop-filter:blur(6px)}
.ph{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 8px}
.ph h2{margin:0;font-size:15px;letter-spacing:.12em;text-transform:uppercase}
.ph h2 span{color:var(--yellow)}
.qty{display:flex;gap:3px}
.qty button{background:rgba(255,255,255,.08);border:1px solid var(--line);color:#cfe2ff;font-size:11px;font-weight:800;padding:4px 7px;border-radius:3px;cursor:pointer}
.qty button.on{background:var(--yellow);color:#06122b;border-color:var(--yellow)}
#upgrades{flex:1;overflow-y:auto;padding:0 10px 10px;display:flex;flex-direction:column;gap:8px}
.up{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;background:linear-gradient(90deg,rgba(21,86,196,.45),rgba(13,58,140,.25));
  border:1px solid var(--line);border-radius:6px;padding:8px 10px;cursor:pointer;transition:transform .08s,border-color .2s}
.up .ic{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3d8bff,#0b2b6b);display:grid;place-items:center;font-size:22px;border:2px solid var(--sky)}
.up .nm{font-weight:800;font-size:14px}.up .nm i{font-style:normal;color:var(--yellow);font-size:12px;margin-left:6px}
.up .ef2{font-size:12px;color:#bcd6ff;font-variant-numeric:tabular-nums}
.up .ef2 b{color:#7dffa6}
.up .buy{min-width:84px;text-align:center;padding:7px 8px;border-radius:5px;background:linear-gradient(90deg,#3d63b0 var(--p,0%),#243b6b var(--p,0%));color:#8aa2cf;font-weight:900;font-size:13px;font-variant-numeric:tabular-nums}
.up.can{border-color:var(--yellow)}
.up.can .buy{background:var(--yellow);color:#06122b;box-shadow:0 0 12px rgba(255,210,31,.5);animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 2px rgba(255,210,31,.2)}}
.up:active{transform:scale(.98)}
.up.pres{border-style:dashed;background:linear-gradient(90deg,rgba(120,60,200,.35),rgba(13,58,140,.25))}
.up.pres .ic{background:radial-gradient(circle at 35% 30%,#b57bff,#3a1b7a)}
.mbox button+button{margin-left:8px}
.up.max .buy{background:#1c7a4a;color:#fff}
.pf{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;border-top:1px solid var(--line);font-size:11px;color:#8fb0e6}
.pf button{background:none;border:1px solid var(--line);color:#8fb0e6;border-radius:4px;font-size:11px;padding:3px 8px;cursor:pointer}

/* ticker */
#ticker{position:fixed;left:0;right:0;bottom:0;height:42px;display:flex;z-index:5;background:linear-gradient(180deg,var(--blue),var(--navy));border-top:3px solid var(--yellow)}
.tk-label{display:flex;align-items:center;padding:0 22px 0 14px;background:var(--yellow);color:#06122b;font-weight:900;letter-spacing:.12em;font-size:14px;clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%)}
.tk-view{flex:1;position:relative;overflow:hidden}
#tk{position:absolute;left:100%;top:0;height:100%;display:flex;align-items:center;white-space:nowrap;font-size:16px;font-weight:600}
@keyframes tk{to{transform:translateX(calc(-100% - var(--cw,1000px)))}}
#q-text{font-weight:800;font-size:15px;margin-top:2px}
#q-rew{float:right;color:#7dffa6;letter-spacing:0;text-transform:none}
#q-num{font-size:11px;color:#b8d2ff;margin-top:3px;font-variant-numeric:tabular-nums}
.bar{height:6px;background:rgba(255,255,255,.12);border-radius:3px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--yellow);transition:width .3s}
#quest.done{animation:qdone .9s}
@keyframes qdone{0%{box-shadow:0 0 0 0 rgba(125,255,166,.9);border-left-color:#7dffa6}100%{box-shadow:0 0 0 18px rgba(125,255,166,0)}}
.lrow{display:flex;align-items:center;gap:22px}
#boost{pointer-events:auto;flex:none;width:82px;height:82px;border-radius:50%;border:3px solid #fff3b0;background:radial-gradient(circle at 35% 30%,#ffe36b,#e09a00);color:#06122b;cursor:pointer;position:relative;display:grid;place-items:center;font-size:32px;box-shadow:0 0 18px rgba(255,210,31,.55);font-family:var(--font)}
#boost small{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:800;letter-spacing:.12em;color:#fff;white-space:nowrap;text-shadow:0 1px 3px #000}
#boost.cd{background:conic-gradient(#3d63b0 var(--cd,0%),#16264a 0);border-color:var(--line);box-shadow:none;cursor:default;filter:saturate(.6)}
#boost.on{background:radial-gradient(circle,#fff,#ffd21f);animation:pulse .5s infinite}
#hint{position:fixed;left:14px;bottom:56px;font-size:12px;color:#d6e6ff;background:rgba(7,25,61,.7);padding:6px 10px;border-radius:4px;border:1px solid var(--line);transition:opacity 1.5s;z-index:3;pointer-events:none}

/* modal */
#modal{position:fixed;inset:0;z-index:20;display:none;place-items:center;background:rgba(3,10,26,.62);backdrop-filter:blur(3px)}
#modal.show{display:grid}
.mbox{width:min(480px,92vw);background:linear-gradient(180deg,var(--blue2),var(--navy));border:2px solid var(--yellow);border-radius:8px;padding:22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.6);text-align:center}
.mbox h1{margin:6px 0 4px;font-size:30px;letter-spacing:.06em}.mbox h1 em{color:var(--yellow);font-style:normal}
.mbox p{margin:8px 0;color:#d6e6ff;line-height:1.45;font-size:14px}
.mbox .big{font-size:34px;font-weight:900;color:var(--yellow);margin:6px 0}
.mbox button{margin-top:12px;background:var(--yellow);color:#06122b;border:0;border-radius:6px;font-weight:900;font-size:17px;letter-spacing:.1em;padding:12px 34px;cursor:pointer}
.mbox button:hover{filter:brightness(1.1)}
.mbox ul{text-align:left;margin:8px auto;padding-left:20px;color:#cfe2ff;font-size:13px;line-height:1.6}

/* ===== mobil na výšku: kompaktné UI, vylepšenia ako úzky pás dole ===== */
@media (max-width:860px) and (orientation:portrait){
  /* spoločné kompaktné prvky pre mobil */
  .brand{font-size:14px;gap:6px;padding:0 20px 0 8px}.live{font-size:9px;padding:2px 5px}.headline{display:none}
  .clock{margin-left:auto;font-size:11px;padding:0 8px 0 20px;gap:4px}#bar-btns{padding:0 4px;gap:3px}.ib{width:26px;height:24px;font-size:12px}
  .card{padding:4px 8px;border-left-width:3px}.lbl{font-size:8px;letter-spacing:.1em}
  #money{font-size:20px}#money small{font-size:13px}.sub{font-size:10px;margin-top:0}
  .wind{margin-top:0}.wind b{font-size:17px}.wind span{font-size:10px}.ef{min-width:42px;padding:3px 7px;font-size:13px}.mini{display:none}
  #q-text{font-size:11.5px;margin-top:0}#q-num{display:none}.bar{height:4px;margin-top:3px}
  #boost{width:46px;height:46px;font-size:19px;border-width:2px}#boost small{font-size:8px;bottom:-14px}
  .ph{padding:3px 8px 3px}.ph h2{font-size:10px}.qty button{font-size:9px;padding:2px 5px}
  .up{padding:4px 6px;gap:5px;border-radius:5px}.up .ic{width:26px;height:26px;font-size:13px;border-width:1px}
  .up .nm{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.up .nm i{font-size:9px;margin-left:4px}
  .up .ef2{font-size:9.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .up .buy{min-width:0;padding:4px 5px;font-size:11px;border-radius:4px}
  .pf{display:none}#hint{display:none}
  #ticker{height:28px;border-top-width:2px}.tk-label{padding:0 14px 0 8px;font-size:10px}#tk{font-size:12px}
  .mbox{padding:14px 16px}.mbox h1{font-size:22px}.mbox p,.mbox ul{font-size:12px}.mbox .big{font-size:26px}.mbox button{font-size:14px;padding:9px 22px;margin-top:8px}
  #top{height:34px;border-bottom-width:2px}
  #left{top:40px;left:6px;width:min(190px,50vw);gap:4px}
  #radarwrap{position:fixed;right:6px;top:40px;padding:3px}#radar{width:64px;height:64px}#radarwrap .rl{display:none}
  #panel{left:0;right:0;top:auto;bottom:28px;width:auto;border-radius:8px 8px 0 0;border-top-width:3px}
  #upgrades{flex-direction:row;overflow-x:auto;overflow-y:hidden;gap:6px;padding:0 6px 6px}
  .up{min-width:138px;grid-template-columns:26px 1fr;grid-template-rows:auto auto}.up>div:nth-child(2){min-width:0}
  .up .buy{grid-column:1/3}
}
/* ===== mobil na šírku: štatistiky vľavo, vylepšenia ako úzky stĺpec vpravo ===== */
@media (orientation:landscape) and (max-height:540px){
  /* spoločné kompaktné prvky pre mobil */
  .brand{font-size:14px;gap:6px;padding:0 20px 0 8px}.live{font-size:9px;padding:2px 5px}.headline{display:none}
  .clock{margin-left:auto;font-size:11px;padding:0 8px 0 20px;gap:4px}#bar-btns{padding:0 4px;gap:3px}.ib{width:26px;height:24px;font-size:12px}
  .card{padding:4px 8px;border-left-width:3px}.lbl{font-size:8px;letter-spacing:.1em}
  #money{font-size:20px}#money small{font-size:13px}.sub{font-size:10px;margin-top:0}
  .wind{margin-top:0}.wind b{font-size:17px}.wind span{font-size:10px}.ef{min-width:42px;padding:3px 7px;font-size:13px}.mini{display:none}
  #q-text{font-size:11.5px;margin-top:0}#q-num{display:none}.bar{height:4px;margin-top:3px}
  #boost{width:46px;height:46px;font-size:19px;border-width:2px}#boost small{font-size:8px;bottom:-14px}
  .ph{padding:3px 8px 3px}.ph h2{font-size:10px}.qty button{font-size:9px;padding:2px 5px}
  .up{padding:4px 6px;gap:5px;border-radius:5px}.up .ic{width:26px;height:26px;font-size:13px;border-width:1px}
  .up .nm{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.up .nm i{font-size:9px;margin-left:4px}
  .up .ef2{font-size:9.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .up .buy{min-width:0;padding:4px 5px;font-size:11px;border-radius:4px}
  .pf{display:none}#hint{display:none}
  #ticker{height:28px;border-top-width:2px}.tk-label{padding:0 14px 0 8px;font-size:10px}#tk{font-size:12px}
  .mbox{padding:14px 16px}.mbox h1{font-size:22px}.mbox p,.mbox ul{font-size:12px}.mbox .big{font-size:26px}.mbox button{font-size:14px;padding:9px 22px;margin-top:8px}
  #top{height:30px;border-bottom-width:2px}
  #left{top:35px;left:6px;width:172px;gap:4px}
  .lrow{gap:12px}#radarwrap{padding:3px}#radar{width:60px;height:60px}#radarwrap .rl{display:none}
  #panel{top:35px;right:6px;bottom:32px;width:200px;border-top-width:3px}
  #upgrades{gap:4px;padding:0 5px 5px}
  .up{grid-template-columns:26px 1fr auto}.up>div:nth-child(2){min-width:0}
  .up .buy{min-width:52px}
  #ticker{height:26px}
}
/* slabšie zariadenia: bez rozmazania pozadia panelov (veľmi drahé nad 3D plátnom) */
.low .card,.low #panel,.low #radarwrap,.low #modal{backdrop-filter:none}
.low .card,.low #panel{background:rgba(7,25,61,.9)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="grade"></div>
<div id="grain"></div>
<div id="flash"></div>
<div id="fx"></div>

<header id="top">
  <div class="brand"><span class="live"><i></i>LIVE</span><b>METEO</b><em>24</em></div>
  <div class="headline" id="headline" data-i="headline">Tornádo · priamy prenos z postihnutej oblasti</div>
  <div id="bar-btns"><button class="ib lang" id="btn-lang" data-it="tLang">SK</button><button class="ib" id="btn-cine" data-it="tCine">🎬</button><button class="ib" id="btn-reset" data-it="tReset">↺</button><button class="ib" id="btn-mute" data-it="tMute">🔊</button></div>
  <div class="clock"><span id="clockIcon">⛈️</span><span id="clock">12:00</span></div>
</header>

<section id="left">
  <div class="card">
    <div class="lbl" data-i="lblDamage">Celková spôsobená škoda</div>
    <div id="money">0 <small>€</small></div>
    <div class="sub"><span id="rate">+0 €/s</span><span id="destroyed">0 zničených</span></div>
  </div>
  <div class="card">
    <div class="lbl" data-i="lblWind">Rýchlosť vetra</div>
    <div class="wind"><div><b id="wind">85</b> <span>km/h</span></div><div id="ef" class="ef">TB</div></div>
    <div class="mini"><span><span data-i="diam">Priemer</span> <b id="diam">0</b> m</span><span><span data-i="zone">Zóna</span> <b id="zone">1</b></span></div>
  </div>
  <div class="card" id="quest">
    <div class="lbl"><span data-i="lblQuest">Úloha</span> <span id="q-rew"></span></div>
    <div id="q-text"></div>
    <div class="bar"><i id="q-bar"></i></div><div id="q-num"></div>
  </div>
  <div class="lrow">
    <div id="radarwrap"><span class="rl">RADAR</span><canvas id="radar" width="340" height="340"></canvas></div>
    <button id="boost" data-it="boostTitle"><span>⚡</span><small id="boost-t">SUPERCELA</small></button>
  </div>
</section>

<aside id="panel">
  <div class="ph"><h2 data-ih="panelTitle">Predpoveď · <span>Vylepšenia</span></h2>
    <div class="qty" id="qty"><button data-q="1" class="on">×1</button><button data-q="10">×10</button><button data-q="max">MAX</button></div></div>
  <div id="upgrades"></div>
  <div class="pf"><span data-i="saved">Hra sa ukladá automaticky</span></div>
</aside>

<div id="hint" data-i="hint"></div>

\xF3na",lblQuest:"\xDAloha",boost:"SUPERCELA",boostTitle:"Supercela (medzern\xEDk)",panelTitle:"Predpove\u010F \xB7 <span>Vylep\u0161enia</span>",saved:"Hra sa uklad\xE1 automaticky",newsLabel:"SPR\xC1VY",hint:"Klik = nasmeruj torn\xE1do \xB7 \u0165ahaj = ot\xE1\u010Daj kameru \xB7 koliesko = zoom \xB7 1\u20136 = vylep\u0161enia \xB7 medzern\xEDk = Supercela",tCine:"Filmov\xFD vzh\u013Ead (C)",tReset:"Nov\xE1 hra",tMute:"Zvuk (M)",tLang:"Jazyk / Language",up_power:"Sila vetra",up_radius:"Priemer v\xEDrenia",up_speed:"R\xFDchlos\u0165 posunu",up_storm:"B\xFArka s bleskami",up_value:"Poistn\xE9 plnenia",up_offline:"No\u010Dn\xE1 zmena (offline)",dmg:"dmg/s",off:"vypnut\xE9",lv:"\xDAr. ",maximum:"(maximum)",tb:"TB",tiers:["Dom\u010Dek","Rodinn\xFD dom","Panel\xE1k","Kancel\xE1rska budova","Mrakodrap","Megave\u017Ea"],destroyedN:n=>`${n} zni\u010Den\xFDch`,front:n=>`Front \u010D. ${n}`,ropeStart:["Torn\xE1do sa zu\u017Euje do lana a vln\xED sa \u2013 nepodce\u0148ujte ho!","Pozor: torn\xE1do sa men\xED na \xFAzke lano, st\xE1le je v\u0161ak nebezpe\u010Dn\xE9."],ropeEnd:"Torn\xE1do op\xE4\u0165 naber\xE1 silu a roz\u0161iruje sa.",fire:["Hasi\u010Di hl\xE1sia po\u017Eiar v ruin\xE1ch. Hasi\u010Dsk\xE1 stanica tie\u017E hor\xED.","V trosk\xE1ch vypukol po\u017Eiar. Dym je vidie\u0165 a\u017E za hranice okresu.","Hor\xED. Hasi\u010Di s\xFA na ceste, cesta v\u0161ak nie je na mieste.","Plame\u0148 v ruin\xE1ch: plyn\xE1ri prosia obyvate\u013Eov, aby nefaj\u010Dili."],milestone:n=>`Zni\u010Den\xFDch u\u017E ${n} objektov. Pois\u0165ovne s\xFA v panike.`,boostNews:"SUPERCELA! Torn\xE1do na 10 sek\xFAnd strojn\xE1sobilo silu a zr\xFDchlilo.",storm:["Nad mestom sa strieda blesk za bleskom.","Meteorol\xF3govia: \u201EZachovajte pokoj, ak sa d\xE1.\u201C","B\xFArkov\xE1 aktivita je extr\xE9mna \u2013 blesky v\u0161ade nav\xF4kol."],tierNews:n=>`Pozor: v z\xF3ne pribudli objekty typu \u201E${n}\u201C. Vy\u0161\u0161ia \u0161koda, vy\u0161\u0161ie zisky!`,megaNews:"Mesto sa rozrast\xE1 \u2013 nov\xE9 budovy s\xFA e\u0161te vy\u0161\u0161ie a odolnej\u0161ie!",prestigeName:"Nov\xFD front",prestigeNeedNews:n=>`Nov\xFD front: potrebuje\u0161 aspo\u0148 ${n} \u0161kody v tomto fronte.`,prestigeModal:(n,t,e)=>`<div class="lbl">Prest\xED\u017E</div><h1>NOV\xDD <em>FRONT</em></h1>
    <p>Z torn\xE1da sa stane nov\xE1 tlakov\xE1 n\xED\u017E. Strat\xED\u0161 peniaze, vylep\u0161enia a mesto sa postav\xED odznova, ale z\xEDska\u0161 trval\xFD bonus.</p>
    <div class="big">+${n} \u{1F300}</div><p>Bonus ku v\u0161etk\xFDm \u0161kod\xE1m: \xD7${t} \u2192 <b>\xD7${e}</b></p>
    <button id="m-yes">NOV\xDD FRONT</button> <button id="m-no" ${Ta}>ZRU\u0160I\u0164</button>`,prestigeDone:"Nov\xFD front sa formuje! Mesto sa postavilo odznova.",prestigeGain:(n,t,e)=>`+${n} \u{1F300} \xB7 bonus \xD7${t} <b>(teraz \xD7${e})</b>`,prestigeNeed:(n,t)=>`Potrebuje\u0161 ${n} \u0161kody v tomto fronte \xB7 bonus teraz \xD7${t}`,start:"ZA\u010CA\u0164",locked:"ZAMKNUT\xC9",quests:[n=>`Zni\u010D ${n} budov`,n=>`Rozmetaj ${n} ${n<5?"aut\xE1":"\xE1ut"}`,n=>`K\xFAp ${n} vylep\u0161enia`,n=>n>1?`Zlom ${n} mosty`:"Zlom most",()=>"Pou\u017Ei Supercelu \u26A1",n=>`Sp\xF4sob \u0161kodu ${n} \u20AC`],questDone:(n,t)=>`\xDAloha splnen\xE1: ${n} \u2013 odmena ${t} \u20AC.`,buy_power:(n,t)=>`Sila vetra st\xFApla na ${n} km/h \u2013 ${t}. Obyvatelia sa zam\xFD\u0161\u013Eaj\xFA nad pres\u0165ahovan\xEDm.`,buy_radius:"Torn\xE1do sa roz\u0161\xEDrilo. Do cesty mu u\u017E pad\xE1 aj susedn\xE1 ulica.",buy_speed:"Torn\xE1do zr\xFDchlilo \u2013 meteorol\xF3govia nest\xEDhaj\xFA aktualizova\u0165 mapy.",buy_storm:"Nad oblas\u0165ou sa rozb\xFArila elektrick\xE1 b\xFArka.",buy_value:"Pois\u0165ovne vypl\xE1caj\xFA viac. \u0160kody s\xFA rekordn\xE9!",buy_offline:"No\u010Dn\xE1 zmena prin\xE1\u0161a zisk aj mimo vysielania.",resetModal:`<div class="lbl">Nov\xE1 hra</div><h1>Za\u010Da\u0165 <em>odznova</em>?</h1><p>V\u0161etok postup vr\xE1tane prest\xED\u017Ee sa strat\xED.</p><button id="m-yes">ZMAZA\u0164</button> <button id="m-no" ${Ta}>ZRU\u0160I\u0164</button>`,dur:n=>n>=60?`${Math.floor(n/60)} h ${n%60} min`:`${n} min`,offlineModal:(n,t,e)=>`<div class="lbl">Spr\xE1va z miesta udalosti</div><h1>Vitaj <em>sp\xE4\u0165</em></h1><p>Po\u010Das tvojej nepr\xEDtomnosti (${n}) torn\xE1do \u010Falej ni\u010Dilo \u2013 pri \xFA\u010Dinnosti ${t} %.</p><div class="big">+${e} \u20AC</div><p>Vylep\u0161i \u201ENo\u010Dn\xFA zmenu\u201C pre vy\u0161\u0161\xED offline zisk.</p><button id="m-ok">POKRA\u010COVA\u0164</button>`,introModal:`<h1>TORN\xC1DO <em>IDLE</em></h1>
  <p>Vitaj v priamom prenose METEO 24. Mal\xFD v\xEDr sa bl\xED\u017Ei k mestu. Ni\u010D\xED domy \u2013 za ka\u017Ed\xFA \u0161kodu dost\xE1va\u0161 peniaze, ktor\xE9 investuje\u0161 do silnej\u0161ieho vetra.</p>
  <ul><li><b>Klik</b> do sveta alebo na radar \u2013 nasmeruje torn\xE1do</li><li><b>\u0164ahanie</b> \u2013 ot\xE1\u010Danie kamery, <b>koliesko</b> \u2013 zoom</li><li>Bez z\xE1sahu si torn\xE1do vyber\xE1 najv\xFDnosnej\u0161ie ciele samo</li><li>Hra sa uklad\xE1 a zar\xE1ba aj ke\u010F si pre\u010D</li></ul>
  <button id="m-ok">\u0160TART</button>`,news1:"Meteorologick\xFD \xFAstav varuje: nad regi\xF3nom sa formuje torn\xE1do.",news2:"Ovl\xE1danie: kliknut\xEDm nasmeruje\u0161 torn\xE1do, inak si cestu h\u013Ead\xE1 samo.",flavor:["Predpove\u010F na zajtra: torn\xE1do. Op\xE4\u0165.","Dopravn\xE1 situ\xE1cia: cesty s\xFA vo\u013En\xE9, lebo tam u\u017E ni\u010D nie je.","Starosta: \u201EMali sme zosta\u0165 doma.\u201C","Tlak vzduchu kles\xE1, n\xE1lada obyvate\u013Eov tie\u017E.","Pois\u0165ov\u0148a oznamuje, \u017Ee u\u017E nikoho nepoist\xED. Nikdy.","Neodpor\xFA\u010Dame pikniky v okruhu 50 km od v\xEDrenia.","Report\xE9r hl\xE1si zo strechy domu. Dom u\u017E nie je.","Psy sa skr\xFDvaj\xFA, ma\u010Dky to rie\u0161ia po svojom.","Zber odpadu odlo\u017Een\xFD. Odpad sa zbiera s\xE1m.","Odborn\xEDci: \u201E\u010C\xEDm v\xE4\u010D\u0161\xED vietor, t\xFDm v\xE4\u010D\u0161ie \u0165a\u017Ekosti.\u201C","Torn\xE1do vraj rad\u0161ej mieri na mrakodrapy. M\xE1 rado v\xFDh\u013Eady.","Slne\u010Dn\xE9 prest\xE1vky sa dnes nepredpokladaj\xFA.","Realitn\xE1 kancel\xE1ria pon\xFAka pozemky s v\xFDh\u013Eadom. V\xFDh\u013Ead je teraz v\u0161ade.","Miestny z\xE1hradk\xE1r: \u201ETrampol\xEDnu som naposledy videl nad kostolom.\u201C","Krava zo susednej dediny hl\xE1si prist\xE1tie. Je v poriadku, len zm\xE4ten\xE1.","Pocitov\xE1 teplota: lietaj\xFAca.","Biometeorologick\xE1 z\xE1\u0165a\u017E: \xE1no.","D\xE1\u017Ednik dnes nepom\xF4\u017Ee. Ani zajtra.","Vodi\u010Di, pozor: v protismere let\xED gar\xE1\u017E.","Po\u0161ta doru\u010Duje aj dnes. Kam, to nevie nikto.","\xDA\u010Des d\u0148a: v\u0161etky naraz.","Susedia sa kone\u010Dne spoznali. Stretli sa na tej istej streche.","Pe\u013Eov\xE1 situ\xE1cia: pe\u013E odletel aj so stromami.","Meteorol\xF3g odmieta koment\xE1r a dr\u017E\xED sa st\u013Apa.","\u0160koly zatvoren\xE9. \u017Diaci aj tak tvrdia, \u017Ee \xFAlohu im odf\xFAklo.","Pes zjedol dom\xE1cu \xFAlohu? Nie, tentoraz naozaj torn\xE1do.","Bielize\u0148 vyvesen\xE1 r\xE1no u\u017E schne v susednom okrese.","Vetern\xE1 elektr\xE1re\u0148 hl\xE1si rekordn\xFD v\xFDkon aj rekordn\xFA vzdialenos\u0165.","Stavebn\xFD \xFArad: \u201EKolaud\xE1cie dnes neprebiehaj\xFA. Nie je \u010Do.\u201C","Navig\xE1cia: \u201EPo sto metroch odbo\u010Dte. Alebo budete odbo\u010Den\xED.\u201C","Smetiari \u0161trajkuj\xFA z princ\xEDpu. Nemaj\xFA \u010Do zbiera\u0165.","V\xFDstraha tretieho stup\u0148a. \u0160tvrt\xFD stupe\u0148 e\u0161te nevymysleli.","Horoskop pre v\u0161etky znamenia: dnes v\xE1s nie\u010Do zdvihne.","\u0160arkani\xE1da sa ru\u0161\xED pre nadbytok vetra.","Komin\xE1r oznamuje, \u017Ee kom\xEDny si dnes \u010Distia samy.","Ryb\xE1ri hl\xE1sia \xFAlovok. Chytili plot.","Ceny nehnute\u013Enost\xED klesaj\xFA. Doslova, z v\xFD\u0161ky.","Torn\xE1do zatia\u013E neodpovedalo na \u017Eiados\u0165 o rozhovor.","Dne\u0161n\xE1 rel\xE1cia vznik\xE1 v ter\xE9ne. \u0160t\xFAdio je tie\u017E v ter\xE9ne, proti na\u0161ej v\xF4li.","Odpor\xFA\u010Dame vetra\u0165. Vlastne nie, to sa vybav\xED samo.","Mestsk\xE1 pol\xEDcia rozd\xE1va pokuty za nespr\xE1vne parkovanie na strech\xE1ch.","Babka z tretieho poschodia: \u201EZa mojich \u010Dias f\xFAkalo viac.\u201C","Holuby dnes lietaj\xFA pozadu a hnevaj\xFA sa.","Dopravn\xFD podnik: autobus \u010D\xEDslo 7 dnes prem\xE1va vzduchom.","Futbalov\xFD z\xE1pas preru\u0161en\xFD. Lopta je v inom kraji, br\xE1nka tie\u017E.","K\xFApalisko hl\xE1si: voda z baz\xE9na pr\u0161\xED o dve ulice \u010Falej.","Predava\u010D d\xE1\u017Ednikov prv\xFDkr\xE1t v \u017Eivote uva\u017Euje o inej pr\xE1ci.","Rosn\xFD bod sme stratili. Ak ho n\xE1jdete, vr\xE1\u0165te ho na \xFAstav."]},Tv={title:"Tornado Idle \xB7 METEO 24",headline:"Tornado \xB7 live from the affected area",lblDamage:"Total damage caused",lblWind:"Wind speed",diam:"Diameter",zone:"Zone",lblQuest:"Mission",boost:"SUPERCELL",boostTitle:"Supercell (space bar)",panelTitle:"Forecast \xB7 <span>Upgrades</span>",saved:"The game saves automatically",newsLa
