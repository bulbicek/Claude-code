name: Nasadenie Mestopolis na GitHub Pages

on:
  push:
    branches:
      - ccr-d820aee6-cdhzp5   # predvolená vetva repozitára
      - ccr-d9e4f373-nz8m4z   # vývojová vetva hry
    paths:
      - 'mestopolis/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Príprava stránky
        run: |
          mkdir -p _site
          cp -r mestopolis/. _site/
          # nová verzia cache pre každé nasadenie -> nainštalované PWA sa aktualizujú
          sed -i "s/const VERSION = '[^']*';/const VERSION = 'mestopolis-${GITHUB_SHA::8}';/" _site/sw.js
          grep -n "const VERSION" _site/sw.js
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    # nasadzuje sa iba z predvolenej vetvy (ostatné vetvy len overia, že sa stránka zostaví)
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
